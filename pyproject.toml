[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harf"
version = "0.1.0"
description = "HARF: Hybrid Alignment for Reducing Fragmentation — post-hoc vocabulary extension for Perso-Arabic scripts (Urdu, Sindhi)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "tokenizers>=0.19",
  "transformers>=4.45",
  "numpy",
  "pandas",
  "scipy",
  "pyyaml",
  "sacrebleu>=2.3",
  "matplotlib",
]

[project.optional-dependencies]
gpu = ["torch>=2.2", "peft>=0.11", "accelerate>=0.30", "datasets>=2.19", "safetensors"]
dev = ["pytest"]

[project.scripts]
harf = "harf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
